name: Release firmware

# A tag v<version> builds the three firmware images from that commit, publishes them as
# a GitHub release, then builds and attaches the six font folders (release-fonts.yml).
# The tag must equal the version in platformio.ini [crossindix]. Manual runs build the
# images as workflow artifacts without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PIO_CORE_URL: https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: v
        run: |
          VERSION=$(python3 -c "import configparser; c = configparser.ConfigParser(); c.read('platformio.ini'); print(c['crossindix']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] && [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match platformio.ini version $VERSION"; exit 1
          fi

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: default
            target: x3-x4
          - environment: x4-pro
            target: x4-pro
          - environment: x4-classic
            target: x4-classic
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-py3.14-core6.1.19-${{ matrix.environment }}-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}
      - name: Install PlatformIO Core
        run: uv pip install --system -U "$PIO_CORE_URL"
      - name: Build ${{ matrix.environment }}
        env:
          CROSSINDIX_RELEASE: "1"
        run: |
          set -euo pipefail
          pio run -j1 -e ${{ matrix.environment }} | tee pio-${{ matrix.environment }}.log
          NAME="crossindix-${{ needs.version.outputs.version }}-${{ matrix.target }}.bin"
          mkdir -p dist && cp ".pio/build/${{ matrix.environment }}/firmware.bin" "dist/$NAME"
          {
            echo "## $NAME"
            grep -E "CrossIndix label|RAM:\s|Flash:\s" pio-${{ matrix.environment }}.log | while read -r line; do echo "- ${line}"; done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.target }}
          path: dist/*.bin
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: firmware-*
          merge-multiple: true
          path: dist
      - name: Checksums and notes
        run: |
          cd dist && sha256sum *.bin > SHA256SUMS.txt && cd ..
          BASE=$(python3 -c "import configparser; c = configparser.ConfigParser(); c.read('platformio.ini'); print(c['crossink']['version'])")
          {
            echo "CrossIndix $VERSION, built from CrossInk $BASE with Lipi shaping for Bengali and Devanagari."
            echo
            echo "Firmware: \`crossindix-$VERSION-x3-x4.bin\` (X3 and X4), \`-x4-pro.bin\`, \`-x4-classic.bin\`."
            echo "Fonts: the font folders are attached by the \"Release fonts\" workflow; copy a whole folder into \`.fonts\` on the SD card."
            echo "Install steps and troubleshooting: README.md."
            echo
            echo '```'; cat dist/SHA256SUMS.txt; echo '```'
          } > notes.md
      - name: Create release
        run: |
          PRE=""; case "$VERSION" in *-*) PRE="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/*.bin dist/SHA256SUMS.txt \
            --title "CrossIndix $VERSION" --notes-file notes.md $PRE

  fonts:
    if: github.event_name == 'push'
    needs: publish
    uses: ./.github/workflows/release-fonts.yml
    with:
      tag: ${{ github.ref_name }}
