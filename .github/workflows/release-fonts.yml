name: Release fonts

# Builds the six CrossIndix font folders from the pinned Google Fonts sources
# (scripts/indic-fonts.lock), refuses to publish unless every .cpfont matches
# scripts/indic-fonts.sha256, and attaches one zip per family (with its OFL.txt) to
# the release of the given tag. "Release firmware" calls it for every tagged release;
# the manual form re-attaches the folders to an existing release.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the font folders to (for example v0.1.0-beta)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  fonts:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: "Install font tools (pinned: the output depends on the HarfBuzz and FreeType builds)"
        run: pip install uharfbuzz==0.56.1 fonttools==4.25.0 freetype-py==2.5.1 pyyaml==6.0.1
      - name: Fetch source fonts
        run: python3 scripts/fetch-indic-fonts.py --lock scripts/indic-fonts.lock --out fonts
      - name: Build and verify
        run: scripts/build-indic-fonts.sh --fonts-dir fonts --out dist --jobs 2 --verify scripts/indic-fonts.sha256
      - name: Package
        run: |
          cd dist
          for d in */; do d=${d%/}; [ -f "$d/OFL.txt" ] || { echo "::error::$d has no OFL.txt"; exit 1; }; zip -qr "$d.zip" "$d"; done
          sha256sum *.zip > SHA256SUMS-fonts.txt
          cat SHA256SUMS-fonts.txt
      - name: Attach to release ${{ inputs.tag }}
        run: gh release upload "${{ inputs.tag }}" dist/*.zip dist/SHA256SUMS-fonts.txt --clobber
