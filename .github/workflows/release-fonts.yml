name: Release fonts

# Builds the six CrossIndix font folders from the pinned Google Fonts sources
# (scripts/indic-fonts.lock), refuses to publish unless every .cpfont matches
# scripts/indic-fonts.sha256, and attaches one zip per family (with its OFL.txt) to
# the release of the given tag. "Release firmware" calls it for every tagged release;
# the manual form re-attaches the folders to an existing release.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the font folders to (for example v0.1.0), or 'fonts' to refresh only the rolling release the devices download from"
        required: true
        type: string

permissions:
  contents: write

jobs:
  fonts:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: "Install font tools (pinned: the output depends on the HarfBuzz and FreeType builds)"
        run: pip install uharfbuzz==0.56.1 fonttools==4.25.0 freetype-py==2.5.1 pyyaml==6.0.1
      - name: Fetch source fonts
        run: python3 scripts/fetch-indic-fonts.py --lock scripts/indic-fonts.lock --out fonts
      - name: Build and verify
        run: scripts/build-indic-fonts.sh --fonts-dir fonts --out dist --jobs 2 --verify scripts/indic-fonts.sha256
      - name: Package
        run: |
          cd dist
          for d in */; do d=${d%/}; [ -f "$d/OFL.txt" ] || { echo "::error::$d has no OFL.txt"; exit 1; }; zip -qr "$d.zip" "$d"; done
          sha256sum *.zip > SHA256SUMS-fonts.txt
          cat SHA256SUMS-fonts.txt
          # Flat copies of the .cpfont files for the device's Manage Fonts downloader.
          mkdir -p flat && find . -maxdepth 2 -name '*.cpfont' -exec cp {} flat/ \;
          ls flat | wc -l
      - name: Attach to release ${{ inputs.tag }}
        # Zips for people, the individual .cpfont files plus fonts.json for the device.
        if: inputs.tag != 'fonts'
        run: |
          python3 scripts/generate-font-manifest.py --input dist/flat \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/" \
            --output dist/fonts.json --descriptions-from lib/EpdFont/scripts/sd-fonts.yaml
          gh release upload "${{ inputs.tag }}" dist/*.zip dist/SHA256SUMS-fonts.txt dist/flat/*.cpfont dist/fonts.json --clobber
      - name: Refresh the rolling "fonts" release the firmware downloads from
        # FONT_MANIFEST_URL in src/activities/settings/FontDownloadActivity.h points
        # at this release, so devices always see the current font build.
        run: |
          python3 scripts/generate-font-manifest.py --input dist/flat \
            --base-url "https://github.com/${{ github.repository }}/releases/download/fonts/" \
            --output dist/fonts-rolling.json --descriptions-from lib/EpdFont/scripts/sd-fonts.yaml
          cp dist/fonts-rolling.json dist/rolling/fonts.json 2>/dev/null || { mkdir -p dist/rolling && cp dist/fonts-rolling.json dist/rolling/fonts.json; }
          NOTES="Current CrossIndix font build (format 128), as the device's Manage Fonts screen downloads it. Built from ${{ github.sha }}. For manual installs use the zips here or on a version release."
          if ! gh release view fonts >/dev/null 2>&1; then
            gh release create fonts --title "Font folders for Manage Fonts (current)" --notes "$NOTES" --target "${{ github.sha }}"
          fi
          gh release upload fonts dist/flat/*.cpfont dist/rolling/fonts.json dist/*.zip dist/SHA256SUMS-fonts.txt --clobber
          gh release edit fonts --notes "$NOTES"
